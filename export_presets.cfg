[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/campus/*.json"
exclude_filter="docs/*,scenes/tests/*,scripts/tests/*,scripts/levels/campus/*/*validation.gd,scenes/levels/campus/*/*Validation.tscn"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
; Keep the Web canvas at project resolution instead of multiplying the render
; target by a device-pixel ratio; this keeps browser fill cost predictable.
html/canvas_resize_policy=1
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
